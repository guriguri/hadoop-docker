status = INFO
name = HiveLog4j2
packages = org.apache.hadoop.hive.ql.log

# list of properties
property.hive.log.level = INFO
#property.hive.log.level = DEBUG
property.hive.root.logger = DRFA
property.hive.log.dir = ${sys:java.io.tmpdir}/${sys:user.name}
property.hive.log.file = hive.log
property.hive.perflogger.log.level = INFO

# list of all appenders
#appenders = console, DRFA, DRFAAUDIT, DRFASQL
appenders = console, DRFA

# console appender
appender.console.type = Console
appender.console.name = console
appender.console.target = SYSTEM_ERR
appender.console.layout.type = PatternLayout
appender.console.layout.pattern = %d{ISO8601} %5p [%t] %c{2}: %m%n

# daily rolling file appender
appender.DRFA.type = RollingRandomAccessFile
appender.DRFA.name = DRFA
appender.DRFA.fileName = ${sys:hive.log.dir}/${sys:hive.log.file}
# Use %pid in the filePattern to append <process-id>@<host-name> to the filename if you want separate log files for different CLI session
appender.DRFA.filePattern = ${sys:hive.log.dir}/${sys:hive.log.file}.%d{yyyy-MM-dd}
appender.DRFA.layout.type = PatternLayout
appender.DRFA.layout.pattern = %d{ISO8601} %5p [%t] %c{2} (%F:%M(%L)): %m%n
appender.DRFA.policies.type = Policies
appender.DRFA.policies.time.type = TimeBasedTriggeringPolicy
appender.DRFA.policies.time.interval = 1
appender.DRFA.policies.time.modulate = true
appender.DRFA.strategy.type = DefaultRolloverStrategy
appender.DRFA.strategy.max = 30

# list of all loggers
#loggers = NIOServerCnxn, ClientCnxnSocketNIO, DataNucleus, Datastore, JPOX, PerfLogger, AmazonAws, ApacheHttp, SentryAudit, SentrySql, TThreadPoolServer, HiveMetaStore, HiveService, SimpleFetchOptimizer, GenericUDFToUnixTimeStamp, TimestampWritableV2
loggers = NIOServerCnxn, ClientCnxnSocketNIO, DataNucleus, Datastore, JPOX, PerfLogger, AmazonAws, ApacheHttp, TThreadPoolServer, HiveMetaStore, HiveService, SimpleFetchOptimizer, GenericUDFToUnixTimeStamp, TimestampWritableV2

logger.NIOServerCnxn.name = org.apache.zookeeper.server.NIOServerCnxn
logger.NIOServerCnxn.level = WARN

logger.ClientCnxnSocketNIO.name = org.apache.zookeeper.ClientCnxnSocketNIO
logger.ClientCnxnSocketNIO.level = WARN

logger.DataNucleus.name = DataNucleus
logger.DataNucleus.level = ERROR

logger.Datastore.name = Datastore
logger.Datastore.level = ERROR

logger.JPOX.name = JPOX
logger.JPOX.level = ERROR

logger.AmazonAws.name=com.amazonaws
logger.AmazonAws.level = INFO

logger.ApacheHttp.name=org.apache.http
logger.ApacheHttp.level = INFO

logger.PerfLogger.name = org.apache.hadoop.hive.ql.log.PerfLogger
logger.PerfLogger.level = ${sys:hive.perflogger.log.level}

# modified log level
logger.TThreadPoolServer.name = org.apache.thrift.server.TThreadPoolServer
logger.TThreadPoolServer.level = FATAL

logger.HiveMetaStore.name = org.apache.hadoop.hive.metastore
logger.HiveMetaStore.level = WARN

logger.HiveService.name = org.apache.hive.service
logger.HiveService.level = INFO

logger.SimpleFetchOptimizer.name = org.apache.hadoop.hive.ql.optimizer.SimpleFetchOptimizer
logger.SimpleFetchOptimizer.level = DEBUG

logger.GenericUDFToUnixTimeStamp.name = org.apache.hadoop.hive.ql.udf.generic.GenericUDFToUnixTimeStamp
logger.GenericUDFToUnixTimeStamp.level = DEBUG

logger.TimestampWritableV2.name = org.apache.hadoop.hive.serde2.io.TimestampWritableV2
logger.TimestampWritableV2.level = DEBUG

# root logger
rootLogger.level = ${sys:hive.log.level}
rootLogger.appenderRefs = root
rootLogger.appenderRef.root.ref = ${sys:hive.root.logger}
## for %F, %M, %L 
## rootLogger.includeLocation is false (default) => only display if ERROR
#rootLogger.includeLocation = true

